name: Reusable Issue Duplication Workflow

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      repository:
        required: true
        type: string
      comment_id:
        required: true
        type: number
    secrets:
      PROJECT_TOKEN:
        required: true
      PROJECT_ID:
        required: true

jobs:
  duplicate-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Check comment author permissions
        id: check_permissions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const [owner, repo] = '${{ inputs.repository }}'.split('/');
            const { data: permissions } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: context.actor
            }).catch(e => ({ data: { permission: 'none' } }));
            
            const allowed = ['admin', 'write', 'maintain'].includes(permissions.permission);
            console.log(`User ${context.actor} has permission: ${permissions.permission}`);
            return allowed;

      - name: Create duplicate issue
        if: steps.check_permissions.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const [owner, repo] = '${{ inputs.repository }}'.split('/');
            
            // Get projects from original issue
            const getProjectQuery = `
              query($owner: String!, $repo: String!, $issueNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issueNumber) {
                    projectV2Items(first: 20) {
                      nodes {
                        project {
                          id
                          number
                          title
                        }
                      }
                    }
                  }
                }
              }
            `;

            let projectItems = [];
            try {
              const projectData = await github.graphql(getProjectQuery, {
                owner,
                repo,
                issueNumber: ${{ inputs.issue_number }}
              });
              projectItems = projectData.repository.issue.projectV2Items.nodes;
              console.log('Found projects:', projectItems.map(p => p.project.title));
            } catch (error) {
              console.log('Error fetching projects:', error);
            }

            // Fetch original issue details
            const { data: originalIssue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: ${{ inputs.issue_number }}
            });

            const timestamp = new Date().toISOString();
            const newBody = `🔄 *This is a duplicate of #${originalIssue.number}*
            
            ## Original Issue Content
            ${originalIssue.body || ''}
            
            ## Additional Information
            - Original Issue: #${originalIssue.number}
            - Duplicated by: @${context.actor}
            - Duplicated on: ${timestamp}
            
            ---
            *Note: This is an automated duplicate. Please refer to the original issue for complete context.*`;
            
            // Create duplicate issue
            const newIssue = await github.rest.issues.create({
              owner,
              repo,
              title: `[Duplicate] ${originalIssue.title}`,
              body: newBody,
              labels: originalIssue.labels.map(label => label.name),
              assignees: originalIssue.assignees.map(assignee => assignee.login)
            });

            // Add to projects if any found
            let addedProjects = [];
            if (projectItems.length > 0) {
              const addToProjectMutation = `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item {
                      id
                    }
                  }
                }
              `;

              for (const item of projectItems) {
                try {
                  await github.graphql(addToProjectMutation, {
                    projectId: item.project.id,
                    contentId: newIssue.data.node_id
                  });
                  addedProjects.push(item.project.title);
                  console.log(`Added to project: ${item.project.title}`);
                } catch (error) {
                  console.error(`Failed to add to project ${item.project.title}:`, error);
                }
              }
            }

            // Add reference comments
            const projectInfo = addedProjects.length > 0 
              ? `\nAdded to projects: ${addedProjects.join(', ')}` 
              : '';

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: originalIssue.number,
              body: `✅ Issue duplicated to #${newIssue.data.number} by @${context.actor}${projectInfo}`
            });
            
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: newIssue.data.number,
              body: `This issue was duplicated using command by @${context.actor}${projectInfo}`
            });

      - name: Comment if user lacks permission
        if: steps.check_permissions.outputs.result != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const [owner, repo] = '${{ inputs.repository }}'.split('/');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: ${{ inputs.issue_number }},
              body: `⚠️ @${context.actor} - You don't have permission to duplicate issues. Please contact a repository maintainer.`
            });
